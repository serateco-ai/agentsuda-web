name: Deploy agentsuda.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentsuda-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source
        run: npm run check
      - name: Build static assets
        run: npm run build
      - name: Deploy to Cloudflare Workers
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify production deployment
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://agentsuda.com/ -o /tmp/agentsuda.html
          grep -q '<title>agentsuda' /tmp/agentsuda.html
          curl --fail --silent --show-error --retry 3 https://agentsuda.com/style.css -o /dev/null
          curl --fail --silent --show-error --retry 3 https://agentsuda.com/app.js -o /dev/null
